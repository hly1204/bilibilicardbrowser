name: x86_64 release builds
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ucrt-x86_64, sys: ucrt64, platform: win32-g++ }

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.sys }}
          update: true
          install: >-
            patch
            mingw-w64-${{ matrix.name }}-git
            mingw-w64-${{ matrix.name }}-toolchain
            mingw-w64-${{ matrix.name }}-cmake
            mingw-w64-${{ matrix.name }}-ninja
            mingw-w64-${{ matrix.name }}-zlib
            mingw-w64-${{ matrix.name }}-zstd
            mingw-w64-${{ matrix.name }}-brotli
            mingw-w64-${{ matrix.name }}-7zip

      - name: Install Qt6
        shell: msys2 {0}
        run: |
          wget https://github.com/hly1204/UCRT64-packages/releases/download/v6.11.0-1/${MINGW_PACKAGE_PREFIX}-qt6-base-6.11.0-1-any.pkg.tar.zst
          wget https://github.com/hly1204/UCRT64-packages/releases/download/v6.11.0-1/${MINGW_PACKAGE_PREFIX}-qt6-svg-6.11.0-1-any.pkg.tar.zst
          wget https://github.com/hly1204/UCRT64-packages/releases/download/v6.11.0-1/${MINGW_PACKAGE_PREFIX}-qt6-tools-6.11.0-1-any.pkg.tar.zst
          wget https://github.com/hly1204/UCRT64-packages/releases/download/v6.11.0-1/${MINGW_PACKAGE_PREFIX}-qt6-translations-6.11.0-1-any.pkg.tar.zst
          echo "904c9d2eecee53d566b1bd540fe8463d88adb88269072176927e7b0f4922bd30 *${MINGW_PACKAGE_PREFIX}-qt6-base-6.11.0-1-any.pkg.tar.zst" | sha256sum -c -
          echo "0d278b8ed57d60c3ac2202f7ac00ffe8a33902614048a19144b54ffcde09bd84 *${MINGW_PACKAGE_PREFIX}-qt6-svg-6.11.0-1-any.pkg.tar.zst" | sha256sum -c -
          echo "b92c39dd117b80f469e340989bb3427aeee9d543f59c57d9b921f771b188afcf *${MINGW_PACKAGE_PREFIX}-qt6-tools-6.11.0-1-any.pkg.tar.zst" | sha256sum -c -
          echo "7eef672abe9b35557f4a45245ad4474fc755a235a17e483e3db39953e29a2cf3 *${MINGW_PACKAGE_PREFIX}-qt6-translations-6.11.0-1-any.pkg.tar.zst" | sha256sum -c -
          pacman -U --noconfirm \
                 ${MINGW_PACKAGE_PREFIX}-qt6-base-6.11.0-1-any.pkg.tar.zst \
                 ${MINGW_PACKAGE_PREFIX}-qt6-svg-6.11.0-1-any.pkg.tar.zst \
                 ${MINGW_PACKAGE_PREFIX}-qt6-tools-6.11.0-1-any.pkg.tar.zst \
                 ${MINGW_PACKAGE_PREFIX}-qt6-translations-6.11.0-1-any.pkg.tar.zst

      - name: Build
        shell: msys2 {0}
        run: |
          mkdir -p build && cd build
          cmake -D CMAKE_BUILD_TYPE=Release \
                -D CMAKE_WIN32_EXECUTABLE=ON \
                -D CMAKE_CXX_FLAGS_RELEASE="-DNDEBUG -O2 -march=nocona -msahf -mtune=generic -fcf-protection=full -fstack-protector-strong -fvisibility=hidden -fvisibility-inlines-hidden -fno-exceptions" \
                ..
          cmake --build . --parallel
          cmake --install . \
                --prefix=${PWD}/bilibilicardbrowser-${{ matrix.name }} \
                --strip
          echo "Translations = share/qt6/translations" >>bilibilicardbrowser-${{ matrix.name }}/bin/qt.conf
          ldd bilibilicardbrowser-${{ matrix.name }}/bin/bilibilicardbrowser.exe | grep ${MSYSTEM_PREFIX} | awk -F ' ' '{print $3}' | xargs -I {} cp -pv {} bilibilicardbrowser-${{ matrix.name }}/bin
          7z a bilibilicardbrowser-${{ matrix.name }}.7z bilibilicardbrowser-${{ matrix.name }}

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: bilibilicardbrowser-${{ matrix.name }}
          path: ${{ github.workspace }}/build/bilibilicardbrowser-${{ matrix.name }}.7z

  release:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          path: ./
          merge-multiple: true

      - name: Upload to Release
        id: upload_to_release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "*.7z"
          immutableCreate: true
