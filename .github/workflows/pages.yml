name: Build pages
on: workflow_dispatch

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ucrt64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-git
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-brotli
            mingw-w64-ucrt-x86_64-qt6
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-clang-libs
            mingw-w64-ucrt-x86_64-clang-tools-extra
            mingw-w64-ucrt-x86_64-llvm
            mingw-w64-ucrt-x86_64-llvm-libs

      - name: Build CodeBrowser
        run: |
          git clone https://github.com/hly1204/codebrowser.git
          INCLUDE=`cygpath -m ${MSYSTEM_PREFIX}/include` cmake -B build-codebrowser \
                                                               -D CMAKE_BUILD_TYPE=Release \
                                                               -S codebrowser \
                                                               -D CMAKE_INSTALL_PREFIX=${MSYSTEM_PREFIX}
          cmake --build build-codebrowser
          cmake --install build-codebrowser --strip

      - name: Generate docs
        id: build
        run: |
          CXXFLAGS="-Wall -Wextra -pedantic -Wshadow -Wfloat-equal -Wconversion -Wshift-overflow -Wcast-qual -Wcast-align -Wno-unused-result -Wno-sign-conversion" cmake \
                -B build \
                -D CMAKE_BUILD_TYPE=Release \
                -D CMAKE_WIN32_EXECUTABLE=ON \
                -D CMAKE_EXPORT_COMPILE_COMMANDS=ON \
                -S .
          cmake --build build
          codebrowser_generator -p bilibilicardbrowser:`cygpath -m ${PWD}` \
                                -b `cygpath -m ${PWD}`/build -a \
                                -o html/code
          codebrowser_indexgenerator -o html/code
          cp -r ${MSYSTEM_PREFIX}/share/woboq/data html

      - name: Upload
        id: deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
